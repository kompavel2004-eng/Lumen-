<!doctype html>
<html lang="ru">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1, viewport-fit=cover">
<meta name="theme-color" content="#6b4cd6">
<meta name="apple-mobile-web-app-capable" content="yes">
<meta name="mobile-web-app-capable" content="yes">
<meta name="apple-mobile-web-app-title" content="Lumen English">
<link rel="manifest" href="manifest.json">
<link rel="apple-touch-icon" href="icon-192.png">
<title>Lumen English</title>
<style>
:root{
  --bg:#f3faf8;--surface:#ffffff;--text:#1b2a3b;--muted:#62758a;--line:#d8e8e3;
  --green:#1aa88e;--green-d:#0b7667;--green-l:#d8f3ec;
  --violet:#6b4cd6;--violet-2:#8a6bf0;--violet-d:#4a31ad;--violet-l:#ece7ff;--onv:#ffffff;
  --ok:#0b7f62;--okbg:#d9f6ec;--bad:#c0334f;--badbg:#fde6eb;--warn:#8a5d0c;--warnbg:#fff2d3;
  --shadow:0 6px 22px rgba(70,55,150,.09);--r:18px;
}
@media (prefers-color-scheme:dark){
  :root{
    --bg:#0d1517;--surface:#15252a;--text:#e7f3f0;--muted:#93a9aa;--line:#25393d;
    --green:#3fd0b4;--green-d:#86e6d3;--green-l:#163a36;
    --violet:#9b82ff;--violet-2:#b7a4ff;--violet-d:#c9bcff;--violet-l:#2a2350;--onv:#120d2b;
    --ok:#7be3c6;--okbg:#12392f;--bad:#ff8aa0;--badbg:#44202a;--warn:#f1c36b;--warnbg:#3f3216;
    --shadow:0 6px 22px rgba(0,0,0,.35);
  }
}
*{box-sizing:border-box;-webkit-tap-highlight-color:transparent}
html{scroll-behavior:smooth}
body{margin:0;background:var(--bg);color:var(--text);
  font:16px/1.5 ui-rounded,"SF Pro Rounded","Nunito","Segoe UI",system-ui,-apple-system,Roboto,"Helvetica Neue",Arial,sans-serif;
  -webkit-font-smoothing:antialiased;text-rendering:optimizeLegibility}
button{font:inherit;color:inherit;cursor:pointer}
textarea{font:inherit;color:inherit}
h1,h2,h3,p{margin:0}
.ic{width:20px;height:20px;flex:none;vertical-align:middle}
#app{max-width:640px;margin:0 auto;min-height:100vh;padding-bottom:calc(92px + env(safe-area-inset-bottom))}

/* ---------- верхняя панель ---------- */
.top{position:sticky;top:0;z-index:20;display:flex;align-items:center;gap:10px;
  padding:calc(10px + env(safe-area-inset-top)) 16px 10px;background:var(--bg);
  background:color-mix(in srgb,var(--bg) 86%,transparent);
  -webkit-backdrop-filter:blur(12px);backdrop-filter:blur(12px)}
.logo{width:34px;height:34px;flex:none}
.brand{font-weight:800;font-size:19px;letter-spacing:-.02em}
.brand i{font-style:normal;color:var(--violet)}
.ttl{font-weight:700;font-size:17px;white-space:nowrap;overflow:hidden;text-overflow:ellipsis}
.backbtn{width:38px;height:38px;border-radius:12px;border:1px solid var(--line);background:var(--surface);
  display:grid;place-items:center;color:var(--violet-d)}
.sp{flex:1}
.pill{display:inline-flex;align-items:center;gap:5px;padding:5px 11px;border-radius:999px;
  background:var(--violet-l);color:var(--violet-d);font-weight:700;font-size:14px}
.pill .ic{width:16px;height:16px}

main{padding:6px 16px 16px;animation:fade .25s ease-out}
@keyframes fade{from{opacity:0;transform:translateY(6px)}to{opacity:1;transform:none}}
@media (prefers-reduced-motion:reduce){main{animation:none}*{transition:none!important;scroll-behavior:auto!important}}

.h1{font-size:26px;line-height:1.2;font-weight:800;letter-spacing:-.02em;margin:8px 0 6px}
.sub{color:var(--muted);margin:0 0 14px}
.muted{color:var(--muted);font-size:14px}
.row{display:flex;align-items:center;gap:12px;justify-content:space-between}
.center{text-align:center}

/* ---------- карточки и кнопки ---------- */
.card{background:var(--surface);border:1px solid var(--line);border-radius:var(--r);padding:16px;
  box-shadow:var(--shadow);margin:0 0 14px}
.card.locked{opacity:.65;box-shadow:none;background:transparent;border-style:dashed}
.btn{display:inline-flex;align-items:center;justify-content:center;gap:8px;padding:13px 20px;border:0;border-radius:14px;
  background:linear-gradient(135deg,var(--violet),var(--violet-2));color:var(--onv);font-weight:700;
  box-shadow:0 6px 16px rgba(107,76,214,.28);transition:transform .12s,filter .12s}
.btn:active{transform:scale(.97)}
.btn.full{display:flex;width:100%;margin:0 0 12px}
.btn.sm{padding:9px 16px;font-size:15px}
.btn.ghost{background:var(--surface);color:var(--violet-d);border:1.5px solid var(--violet);box-shadow:none}
.btn.green{background:linear-gradient(135deg,var(--green),#43c9ae);color:#04332b}
.btn.off{opacity:.45;pointer-events:none}
.btn[disabled]{opacity:.45;pointer-events:none}
.bar{height:8px;border-radius:99px;background:var(--green-l);overflow:hidden;margin:6px 0 14px}
.bar i{display:block;height:100%;border-radius:99px;background:linear-gradient(90deg,var(--green),var(--violet));transition:width .35s}
.tag{display:inline-flex;align-items:center;gap:4px;font-size:13px;font-weight:700;padding:3px 10px;border-radius:99px;
  background:var(--violet-l);color:var(--violet-d)}
.tag.ok{background:var(--okbg);color:var(--ok)}
.tag .ic{width:14px;height:14px}
.chips{display:flex;gap:8px;flex-wrap:wrap;margin:0 0 14px}
.chip{padding:8px 14px;border-radius:99px;border:1.5px solid var(--line);background:var(--surface);font-weight:600;font-size:15px}
.chip.on{background:var(--violet);border-color:var(--violet);color:var(--onv)}

/* ---------- главная ---------- */
.hero{background:linear-gradient(140deg,#0f9a82 0%,#4f6fe0 62%,#6b4cd6 100%);color:#fff;border-radius:26px;
  padding:22px 20px 20px;margin:6px 0 16px;box-shadow:0 12px 30px rgba(86,70,200,.28)}
.hero .hello{font-weight:600;opacity:.9}
.hero h1{font-size:25px;line-height:1.2;font-weight:800;letter-spacing:-.02em;margin:4px 0 8px}
.hero p{opacity:.92;font-size:15px}
.hstats{display:flex;gap:10px;margin-top:16px}
.hstat{flex:1;background:rgba(255,255,255,.16);border-radius:14px;padding:10px 12px}
.hstat b{display:block;font-size:22px;line-height:1.1}
.hstat span{font-size:12.5px;opacity:.9}
.next{display:flex;align-items:center;gap:14px;text-align:left;width:100%;border:1.5px solid var(--violet);
  background:var(--surface);border-radius:var(--r);padding:14px 16px;margin:0 0 14px;box-shadow:var(--shadow)}
.next b{display:block}
.tiles{display:grid;grid-template-columns:1fr 1fr;gap:12px}
.tile{display:flex;flex-direction:column;align-items:flex-start;gap:4px;text-align:left;border:0;border-radius:20px;
  padding:16px;min-height:118px;background:var(--green-l);color:var(--green-d)}
.tile.v{background:var(--violet-l);color:var(--violet-d)}
.tile .ic{width:26px;height:26px;margin-bottom:6px}
.tile b{font-size:17px;color:var(--text)}
.tile span{font-size:13.5px;color:var(--muted);line-height:1.3}
.tile.wide{grid-column:1/-1;min-height:0;flex-direction:row;align-items:center;gap:14px}
.tile.wide .ic{margin:0}
.offline{margin:18px 4px 0;color:var(--muted);font-size:13.5px;text-align:center}

/* ---------- словарь ---------- */
.lesson{display:flex;align-items:center;gap:14px;width:100%;text-align:left;background:var(--surface);
  border:1px solid var(--line);border-radius:var(--r);padding:14px 16px;margin:0 0 12px;box-shadow:var(--shadow)}
.lesson.locked{box-shadow:none;background:transparent;border-style:dashed;opacity:.7}
.lesson .num{width:42px;height:42px;border-radius:14px;display:grid;place-items:center;font-weight:800;font-size:18px;
  background:var(--green-l);color:var(--green-d);flex:none}
.lesson.locked .num{background:var(--violet-l);color:var(--violet-d)}
.lesson .mid{flex:1;min-width:0}
.lesson .mid b{display:block}
.lesson .bar{margin:8px 0 0;height:6px}
.blockhead{display:flex;align-items:center;justify-content:space-between;margin:18px 2px 10px;font-weight:800;font-size:18px}
.word .wtop{display:flex;justify-content:space-between;align-items:center;gap:10px}
.wen{font-size:24px;font-weight:800;letter-spacing:-.01em}
.ipa{color:var(--violet-d);font-size:15px}
.wru{font-size:18px;font-weight:600;color:var(--green-d);margin:6px 0 10px}
.wex{display:flex;align-items:center;justify-content:space-between;gap:10px;padding-top:10px;border-top:1px dashed var(--line);font-style:italic}
.say{width:38px;height:38px;border-radius:50%;border:0;flex:none;display:grid;place-items:center;
  background:var(--violet-l);color:var(--violet-d)}
.say:active{transform:scale(.92)}
.say.slow{width:auto;padding:0 12px;border-radius:99px;font-weight:700;font-size:13px}

/* ---------- квиз ---------- */
.qhead{display:flex;justify-content:space-between;font-weight:700;color:var(--muted);font-size:14px;margin-top:6px}
.qcard{text-align:center;padding:22px 16px}
.qlabel{color:var(--muted);font-size:14px;margin-bottom:10px}
.qprompt{font-size:28px;font-weight:800;letter-spacing:-.01em;display:flex;align-items:center;justify-content:center;gap:12px;flex-wrap:wrap}
.qprompt.small{font-size:21px;line-height:1.35;font-weight:700}
.opts{margin:0 0 6px}
.opt{display:block;width:100%;text-align:left;padding:14px 16px;border-radius:14px;border:1.5px solid var(--line);
  background:var(--surface);font-weight:650;margin:0 0 10px;transition:background .15s,border-color .15s,transform .1s}
.opt:active{transform:scale(.985)}
.opt.good{background:var(--okbg);border-color:var(--ok);color:var(--ok)}
.opt.bad{background:var(--badbg);border-color:var(--bad);color:var(--bad)}
.opt.dim{opacity:.55}
.fb{border-radius:14px;padding:12px 14px;margin:6px 0 14px}
.fb.ok{background:var(--okbg);color:var(--ok)}
.fb.bad{background:var(--badbg);color:var(--bad)}
.fb .muted{color:inherit;opacity:.85;margin-top:4px;font-style:italic}
.big{font-size:56px;font-weight:800;line-height:1;letter-spacing:-.03em;color:var(--violet-d)}
.big small{font-size:26px;color:var(--muted);font-weight:700}

/* ---------- грамматика ---------- */
.sent{display:flex;flex-wrap:wrap;gap:2px;margin:10px -3px 4px;font-size:19px}
.tok{border:1.5px dashed var(--line);background:var(--surface);border-radius:10px;padding:6px 9px;margin:3px;font-size:19px;line-height:1.3}
.tok.sel{border-style:solid;border-color:var(--violet);background:var(--violet-l);color:var(--violet-d)}
.tok.wrong{border-style:solid;border-color:var(--bad);background:var(--badbg);color:var(--bad)}
.tok.right{border-style:solid;border-color:var(--ok);background:var(--okbg);color:var(--ok)}
.tok[disabled]{cursor:default}
.hint{color:var(--muted);font-size:14.5px;margin:2px 0 10px}
.rule{border-left:4px solid var(--violet);background:var(--violet-l);border-radius:0 14px 14px 0;padding:12px 14px;margin:0 0 14px}
.rule b{display:block;color:var(--violet-d);margin-bottom:4px}
.fixed{font-size:18px;font-weight:700;margin:2px 0 12px}
.fixed mark{background:var(--okbg);color:var(--ok);padding:1px 6px;border-radius:7px}
.verdict{font-weight:800;font-size:18px;margin-bottom:6px}
.verdict.ok{color:var(--ok)}
.verdict.bad{color:var(--bad)}

/* ---------- тексты ---------- */
.txtitem{display:flex;align-items:center;gap:14px;width:100%;text-align:left;background:var(--surface);
  border:1px solid var(--line);border-radius:var(--r);padding:14px 16px;margin:0 0 12px;box-shadow:var(--shadow)}
.txtitem .mid{flex:1;min-width:0}
.txtitem b{display:block}
.en-text{font-size:20px;line-height:1.55;font-weight:550}
.gl{border-bottom:2px dotted var(--violet);color:var(--violet-d);font-weight:700;cursor:pointer}
textarea.tr{width:100%;min-height:96px;padding:12px 14px;border-radius:14px;border:1.5px solid var(--line);
  background:var(--surface);resize:vertical;margin:12px 0}
textarea.tr:focus{outline:2px solid var(--violet);border-color:transparent}
.ref{background:var(--green-l);border-radius:14px;padding:12px 14px;margin:0 0 12px}
.ref b{color:var(--green-d);display:block;margin-bottom:2px}
.mine{background:var(--violet-l);border-radius:14px;padding:12px 14px;margin:0 0 12px}
.mine b{color:var(--violet-d);display:block;margin-bottom:2px}
.two{display:grid;grid-template-columns:1fr 1fr;gap:10px}
.two .btn{margin:0}
.gloss{display:grid;gap:6px;margin:0}
.gloss div{display:flex;justify-content:space-between;gap:12px;border-bottom:1px dashed var(--line);padding:6px 0}
.gloss span:first-child{font-weight:700}
.gloss span:last-child{color:var(--muted);text-align:right}

/* ---------- карточки-игра ---------- */
.fcard{padding:26px 18px;text-align:center}
.fcard .kind{display:inline-block;margin-bottom:10px}
.fcard .front{font-size:30px;line-height:1.2;font-weight:800;letter-spacing:-.02em}
.fcard .lit{color:var(--muted);margin-top:8px;font-size:14.5px}
.facts{background:var(--warnbg);color:var(--warn);border-radius:14px;padding:12px 14px;margin:0 0 14px;display:flex;gap:10px}
.facts .ic{margin-top:2px}
.facts b{display:block}
.meaning{background:var(--surface);border:1px solid var(--line);border-radius:14px;padding:12px 14px;margin:0 0 12px}
.meaning .ex{font-style:italic;margin-top:8px}
.score{display:flex;justify-content:space-between;font-weight:700;color:var(--muted);font-size:14px;margin-top:6px}
.score .pill{padding:3px 10px}

/* ---------- разговор ---------- */
.bubble{max-width:86%;padding:11px 14px;border-radius:18px;margin:0 0 10px;display:flex;gap:10px;align-items:center;
  line-height:1.4;font-weight:550}
.bubble.p{background:var(--surface);border:1px solid var(--line);border-bottom-left-radius:6px}
.bubble.me{margin-left:auto;background:linear-gradient(135deg,var(--violet),var(--violet-2));color:var(--onv);border-bottom-right-radius:6px}
.bubble.me.v2{background:linear-gradient(135deg,#0f9a82,#2fbfa3);color:#04332b}
.bubble.me.v0{background:linear-gradient(135deg,#c0334f,#e0627a);color:#fff}
.note{border-radius:14px;padding:10px 14px;margin:0 0 12px;font-size:15px}
.note.v2{background:var(--okbg);color:var(--ok)}
.note.v1{background:var(--warnbg);color:var(--warn)}
.note.v0{background:var(--badbg);color:var(--bad)}
.phrase .en{font-size:20px;font-weight:800}
.phrase .ru{color:var(--green-d);font-weight:600;margin:2px 0 6px}
.phrase .alt{font-size:14.5px}
.phrase .alt b{color:var(--violet-d)}
.phrase .tipx{color:var(--muted);font-size:14px;margin-top:4px}
.prow{display:flex;align-items:center;gap:8px;margin-top:12px;flex-wrap:wrap}
.rep{margin-left:auto;display:inline-flex;align-items:center;gap:6px;padding:7px 12px;border-radius:99px;
  border:1.5px solid var(--line);background:var(--surface);font-weight:700;font-size:14px}
.rep.on{background:var(--okbg);border-color:var(--ok);color:var(--ok)}
.rep .ic{width:16px;height:16px}
.lockic{color:var(--violet-d)}

/* ---------- нижняя навигация ---------- */
nav#tabs{position:fixed;left:50%;transform:translateX(-50%);bottom:0;width:100%;max-width:640px;z-index:30;
  display:flex;gap:2px;padding:6px 6px calc(6px + env(safe-area-inset-bottom));
  background:var(--surface);border-top:1px solid var(--line);box-shadow:0 -6px 22px rgba(70,55,150,.08)}
nav#tabs button{flex:1;display:flex;flex-direction:column;align-items:center;gap:2px;padding:7px 2px;border:0;border-radius:14px;
  background:transparent;color:var(--muted);font-size:11px;font-weight:700;min-width:0}
nav#tabs button .ic{width:22px;height:22px}
nav#tabs button.on{background:var(--violet-l);color:var(--violet-d)}

/* ---------- всплывающие ---------- */
#toast{position:fixed;left:50%;bottom:calc(96px + env(safe-area-inset-bottom));transform:translate(-50%,20px);opacity:0;
  background:#241a4f;color:#fff;padding:10px 16px;border-radius:14px;font-weight:600;font-size:14.5px;z-index:60;
  pointer-events:none;transition:opacity .25s,transform .25s;max-width:calc(100% - 32px);text-align:center}
#toast.show{opacity:1;transform:translate(-50%,0)}
#tip{position:fixed;left:16px;right:16px;max-width:608px;margin:0 auto;bottom:calc(92px + env(safe-area-inset-bottom));
  background:#241a4f;color:#fff;border-radius:16px;padding:12px 16px;z-index:55;display:none;box-shadow:0 10px 26px rgba(0,0,0,.3)}
#tip.show{display:block}
#tip b{color:#c9bcff}
:focus-visible{outline:3px solid var(--violet);outline-offset:2px}

</style>
</head>
<body>
<div id="app">
  <header class="top" id="top"></header>
  <main id="main"></main>
</div>
<nav id="tabs"></nav>
<div id="tip" role="status"></div>
<div id="toast" role="status" aria-live="polite"></div>
<script>
/* ================= УЧЕБНЫЙ КОНТЕНТ ================= */

const LESSONS = [
  { id: 'work', title: 'Работа и карьера', sub: 'Офис, цели, обязанности', words: [
    { en: 'deadline', ipa: '/ˈdedlaɪn/', ru: 'крайний срок', ex: 'We must meet the deadline on Friday.', exRu: 'Мы должны уложиться в срок к пятнице.' },
    { en: 'colleague', ipa: '/ˈkɒliːɡ/', ru: 'коллега', ex: 'My colleague helped me with the report.', exRu: 'Мой коллега помог мне с отчётом.' },
    { en: 'achieve', ipa: '/əˈtʃiːv/', ru: 'достигать', ex: 'She worked hard to achieve her goals.', exRu: 'Она много работала, чтобы достичь своих целей.' },
    { en: 'responsibility', ipa: '/rɪˌspɒnsəˈbɪləti/', ru: 'ответственность', ex: 'Taking responsibility is part of growing up.', exRu: 'Брать на себя ответственность — часть взросления.' },
    { en: 'improve', ipa: '/ɪmˈpruːv/', ru: 'улучшать', ex: 'I want to improve my English.', exRu: 'Я хочу улучшить свой английский.' },
    { en: 'schedule', ipa: '/ˈʃedjuːl/', ru: 'расписание, график', ex: 'My schedule is full today.', exRu: 'Мой график сегодня забит.' },
    { en: 'experience', ipa: '/ɪkˈspɪəriəns/', ru: 'опыт', ex: 'She has a lot of experience in marketing.', exRu: 'У неё большой опыт в маркетинге.' },
    { en: 'salary', ipa: '/ˈsæləri/', ru: 'зарплата', ex: 'He asked for a higher salary.', exRu: 'Он попросил более высокую зарплату.' }
  ]},
  { id: 'society', title: 'Общество и новости', sub: 'Политика, экономика, власть', words: [
    { en: 'government', ipa: '/ˈɡʌvənmənt/', ru: 'правительство', ex: 'The government plans to raise taxes.', exRu: 'Правительство планирует повысить налоги.' },
    { en: 'election', ipa: '/ɪˈlekʃn/', ru: 'выборы', ex: 'The election takes place in May.', exRu: 'Выборы пройдут в мае.' },
    { en: 'economy', ipa: '/ɪˈkɒnəmi/', ru: 'экономика', ex: 'The economy is growing slowly.', exRu: 'Экономика растёт медленно.' },
    { en: 'citizen', ipa: '/ˈsɪtɪzn/', ru: 'гражданин', ex: 'Every citizen has the right to vote.', exRu: 'Каждый гражданин имеет право голосовать.' },
    { en: 'policy', ipa: '/ˈpɒləsi/', ru: 'политика (курс), правила', ex: 'The new policy will help young families.', exRu: 'Новая политика поможет молодым семьям.' },
    { en: 'negotiate', ipa: '/nɪˈɡəʊʃieɪt/', ru: 'вести переговоры', ex: 'The two sides will negotiate next week.', exRu: 'Стороны проведут переговоры на следующей неделе.' },
    { en: 'announce', ipa: '/əˈnaʊns/', ru: 'объявлять', ex: 'They will announce the winner tomorrow.', exRu: 'Они объявят победителя завтра.' },
    { en: 'reform', ipa: '/rɪˈfɔːm/', ru: 'реформа', ex: 'The reform changed the school system.', exRu: 'Реформа изменила школьную систему.' }
  ]},
  { id: 'opinions', title: 'Мнения и аргументы', sub: 'Спор, доводы, выводы', words: [
    { en: 'opinion', ipa: '/əˈpɪnjən/', ru: 'мнение', ex: 'In my opinion, the film was too long.', exRu: 'По-моему, фильм был слишком длинным.' },

let Q = null;
function buildQs(words, n) {
  const sample = pick(words, Math.min(n, words.length));
  const kinds = ['en2ru', 'ru2en', 'cloze'];
  const offset = Math.floor(Math.random() * 3);
  return sample.map((w, j) => {
    let kind = kinds[(j + offset) % 3];
    const re = new RegExp('\\b' + w.en + '\\b', 'i');
    if (kind === 'cloze' && !re.test(w.ex)) kind = 'en2ru';
    const others = ALLW.filter(x => x.en !== w.en);
    if (kind === 'en2ru') {
      const seen = { [w.ru]: 1 }; const ds = [];
      shuffle(others).forEach(x => { if (ds.length < 3 && !seen[x.ru]) { seen[x.ru] = 1; ds.push(x.ru); } });
      const opts = shuffle([w.ru].concat(ds));
      return { kind: kind, opts: opts, correct: opts.indexOf(w.ru), w: w, prompt: w.en, sub: '' };
    }
    const opts = shuffle([w.en].concat(pick(others, 3).map(x => x.en)));
    return { kind: kind, opts: opts, correct: opts.indexOf(w.en), w: w, prompt: kind === 'ru2en' ? w.ru : w.ex.replace(re, '_____'), sub: kind === 'cloze' ? w.exRu : '' };
  });
}
function startQuiz(cfg, rep) {

  h += '<div class="card fcard"><span class="tag kind">' + (c.type === 'idiom' ? 'Идиома' : 'Слово') + '</span><div class="front">' + esc(c.en) + '</div>' + (c.ipa ? '<div class="ipa">' + esc(c.ipa) + '</div>' : '') +
    '<div class="prow" style="justify-content:center">' + sayBtn(c.en) + '</div></div>';
  h += '<div class="hint">Что это значит?</div><div class="opts">' + CS.opts.map((o, k) => {
    let cl = 'opt'; if (ans) { if (k === CS.correct) cl += ' good'; else if (k === CS.pick) cl += ' bad'; else cl += ' dim'; }
    return '<button class="' + cl + '" data-act="cans" data-k="' + k + '" ' + (ans ? 'disabled' : '') + '>' + esc(o) + '</button>';
  }).join('') + '</div>';
  if (ans) {
    const ok = CS.pick === CS.correct;
    h += '<div class="fb ' + (ok ? 'ok' : 'bad') + '"><b>' + (ok ? 'Верно!' : 'Не совсем.') + '</b> ' + esc(c.short) + '</div>' +
      '<div class="meaning"><b>Значение</b><div>' + esc(c.ru) + '</div>' + (c.lit ? '<div class="muted" style="margin-top:6px">Буквально: ' + esc(c.lit) + '</div>' : '') +
      '<div class="ex">' + esc(c.ex) + ' ' + sayBtn(c.ex) + '</div><div class="muted">' + esc(c.exRu) + '</div></div>' +
      '<div class="facts">' + ic('bulb') + '<div><b>Интересный факт</b>' + esc(c.fact) + '</div></div>' +
      btn(CS.i + 1 < CS.items.length ? 'Дальше' : 'Результат', 'cnext', '', 'btn full');
  }
  return h;
};

/* ================= РАЗГОВОР ================= */
let SP = 'dialogs';
let SC = null;
const bubbleP = t => '<div class="bubble p"><span>' + esc(t) + '</span>' + sayBtn(t) + '</div>';
const bubbleMe = (t, v) => '<div class="bubble me v' + v + '"><span>' + esc(t) + '</span></div>';
function startScene(idx, rep) {
  SC = { idx: idx, t: 0, score: 0, log: [], pick: null, done: false, order: shuffle([0, 1, 2]) };
  if (rep) replace('scene'); else open('scene');
}
views.speak = () => {
  let h = '<h1 class="h1">Разговорная речь</h1><p class="sub">Живые диалоги и фразы, которые носители говорят каждый день. Слушай, повторяй вслух и выбирай естественные ответы.</p>';
  h += '<div class="chips"><button class="chip ' + (SP === 'dialogs' ? 'on' : '') + '" data-act="sptab" data-t="dialogs">Диалоги</button><button class="chip ' + (SP === 'phrases' ? 'on' : '') + '" data-act="sptab" data-t="phrases">Фразы</button></div>';
  if (SP === 'dialogs') {
    SCENES.forEach((sc, i) => {
      const b = S.speak.scenes[sc.id]; const max = sc.turns.length * 2;
      h += '<button class="txtitem" data-act="scene" data-i="' + i + '"><div class="mid"><b>' + esc(sc.title) + '</b><span class="muted">' + esc(sc.sub) + (b !== undefined ? '. Лучший результат: ' + b + ' из ' + max : '') + '</span></div>' + (b === max ? '<span class="tag ok">' + ic('tick') + '</span>' : ic('right')) + '</button>';
    });
  } else {
    const done = Object.keys(S.speak.phrases).filter(k => S.speak.phrases[k]).length;
    h += '<div class="muted" style="margin-bottom:6px">Повторено вслух: ' + done + ' из ' + PHRASES.length + '</div>' + bar(done, PHRASES.length);
    PHRASES.forEach((p, i) => {
      const on = !!S.speak.phrases[i];
      h += '<div class="card phrase"><div class="en">' + esc(p.en) + '</div><div class="ru">' + esc(p.ru) + '</div><div class="alt"><b>Формальнее:</b> ' + esc(p.formal) + '</div><div class="tipx">' + esc(p.tip) + '</div>' +
        '<div class="prow">' + sayBtn(p.en) + slowBtn(p.en) + '<button class="rep ' + (on ? 'on' : '') + '" data-act="prep" data-i="' + i + '">' + ic('tick') + 'Повторил(а)</button></div></div>';
    });
  }
  return h;
};
views.scene = () => {
  if (!SC) return card('Диалог не выбран.');
  const sc = SCENES[SC.idx]; const max = sc.turns.length * 2;
  if (SC.done) {
    const msg = SC.score === max ? 'Звучишь как носитель!' : SC.score >= max * 0.6 ? 'Хороший результат, осталось отшлифовать детали.' : 'Хорошее начало. Повтори фразы ниже вслух и попробуй снова.';
    return '<div class="card center"><div class="big">' + SC.score + '<small>/' + max + '</small></div><p style="margin-top:10px"><b>' + msg + '</b></p></div>' +
      card('<b>Повтори вслух</b><p class="muted" style="margin:4px 0 8px">Лучшие реплики из диалога. Послушай и скажи вместе с озвучкой.</p>' +
        sc.turns.map(t => { const b = t.c.filter(c => c.v === 2)[0]; return '<div class="row" style="padding:8px 0;border-top:1px dashed var(--line)"><span>' + esc(b.t) + '</span><span class="prow" style="margin:0">' + sayBtn(b.t) + slowBtn(b.t) + '</span></div>'; }).join('')) +
      btn('Пройти ещё раз', 'sretry', '', 'btn full') + btn('К списку диалогов', 'back', '', 'btn ghost full');
  }
  const turn = sc.turns[SC.t];
  let h = '<div class="qhead"><span>' + esc(sc.sub) + '</span><span>' + (SC.t + 1) + ' из ' + sc.turns.length + '</span></div>' + bar(SC.t + (SC.pick !== null ? 1 : 0), sc.turns.length);
  SC.log.forEach(l => { h += bubbleP(l.p) + bubbleMe(l.you, l.v); });
  h += bubbleP(turn.p);
  if (SC.pick === null) {
    h += '<div class="hint" style="margin-top:12px">Выбери лучший ответ.</div><div class="opts">' + SC.order.map(k => '<button class="opt" data-act="sch" data-k="' + k + '">' + esc(turn.c[k].t) + '</button>').join('') + '</div>';
  } else {
    const ch = turn.c[SC.pick];
    h += bubbleMe(ch.t, ch.v) + '<div class="note v' + ch.v + '"><b>' + ['Не получилось.', 'Понятно, но можно естественнее.', 'Отлично!'][ch.v] + '</b> ' + esc(ch.n) + '</div>';
    if (ch.v < 2) { const best = turn.c.filter(c => c.v === 2)[0]; h += '<div class="meaning"><div class="muted">Так сказал бы носитель</div><div class="row"><b>' + esc(best.t) + '</b>' + sayBtn(best.t) + '</div></div>'; }
    h += btn(SC.t + 1 < sc.turns.length ? 'Дальше' : 'Результат', 'snext', '', 'btn full');
  }
  return h;
};

/* ================= ДЕЙСТВИЯ ================= */
const ACT = {
  tab: d => showTab(d.tab),
  back: () => back(),
  lesson: d => open('lesson', { i: +d.i }),

  blockquiz: d => {
    const i = +d.i, k = +d.k, L = LESSONS[i], tot = nBlocks(L);
    startQuiz({
      title: 'Проверка: блок ' + (k + 1), words: L.words.slice(k * BS, (k + 1) * BS), n: BS, passAt: 3,
      onDone: s => {
        if (s >= 3) {
          if ((S.blocks[L.id] || 0) === k) {
            S.blocks[L.id] = k + 1; save();
            Q.fin = k + 1 < tot ? 'Следующий блок открыт!' : (i + 1 < LESSONS.length ? 'Урок пройден! Открыт следующий урок.' : 'Урок пройден! Это был последний урок.');
          } else Q.fin = 'Этот блок уже пройден. Отличное повторение!';
        }
      }
    });
  },
  lessonquiz: d => {
    const L = LESSONS[+d.i]; const b = S.blocks[L.id] || 0;
    startQuiz({ title: 'Квиз: ' + L.title, words: L.words.slice(0, b * BS), n: 8, onDone: generalDone });
  },
  allquiz: () => {
    const lw = learnedWords(); if (lw.length < 4) { toast('Сначала пройди первый блок'); return; }
    startQuiz({ title: 'Квиз по пройденным словам', words: lw, n: 10, onDone: generalDone });
  },
  qans: d => {
    if (Q.pick !== null) return;
    Q.pick = +d.i; if (Q.pick === Q.qs[Q.i].correct) Q.score++;
    touch(); render(); reveal();
  },
  qnext: () => {
    if (Q.i + 1 < Q.total) { Q.i++; Q.pick = null; render(); scrollTop(); }
    else { Q.done = true; if (Q.cfg.onDone) Q.cfg.onDone(Q.score, Q.total); render(); scrollTop(); }
  },
  qretry: () => startQuiz(Q.cfg, true),

  gstart: () => {
    GS = { items: pick(GRAMMAR, Math.min(10, GRAMMAR.length)).map(it => ({ it: it, p: parseG(it), opts: shuffle(it.opts) })), i: 0, score: 0, step: 1, sel: null, pick: null, ok1: false, ok2: false, mist: [], done: false };
    open('gplay');
  },
  gstart2: () => {
    GS = { items: pick(GRAMMAR, Math.min(10, GRAMMAR.length)).map(it => ({ it: it, p: parseG(it), opts: shuffle(it.opts) })), i: 0, score: 0, step: 1, sel: null, pick: null, ok1: false, ok2: false, mist: [], done: false };
    replace('gplay');
  },
  gtok: d => {
    if (!GS || GS.step !== 1) return;
    const c = GS.items[GS.i]; const k = +d.k; GS.sel = k; touch();
    if (c.p.toks[k].bad) { GS.ok1 = true; GS.step = 2; }
    else { GS.ok1 = false; GS.step = 3; GS.mist.push(c.it.rule); S.gram.done++; save(); }
    render(); reveal();
  },
  gopt: d => {
    if (!GS || GS.step !== 2) return;
    const c = GS.items[GS.i]; GS.pick = +d.k; GS.ok2 = c.opts[GS.pick] === c.it.ans; GS.step = 3;
    S.gram.done++; if (GS.ok2) { S.gram.correct++; GS.score++; } else GS.mist.push(c.it.rule);
    save(); render(); reveal();
  },
  gnext: () => {
    if (GS.i + 1 < GS.items.length) { GS.i++; GS.step = 1; GS.sel = null; GS.pick = null; GS.ok1 = false; GS.ok2 = false; }
    else GS.done = true;
    render(); scrollTop();
  },

  tread: d => { TS = { n: +d.i, i: 0, shown: false, draft: '', oks: 0, done: false }; open('reader'); },
  tagain: () => { TS = { n: TS.n, i: 0, shown: false, draft: '', oks: 0, done: false }; render(); scrollTop(); },
  tshow: () => { const ta = $('#draft'); if (ta) TS.draft = ta.value; TS.shown = true; touch(); render(); reveal(); },
  trate: d => {
    const T = TEXTS[TS.n]; if (d.r === 'ok') TS.oks++;
    TS.i++; TS.shown = false; TS.draft = '';
    if (TS.i >= T.s.length) { TS.done = true; S.texts[T.id] = { done: true, ok: TS.oks, total: T.s.length }; save(); }
    render(); scrollTop();
  },

  cmode: d => { CM = d.m; render(); },
  cstart: () => { startCards(CM); open('cplay'); },
  cagain: () => { startCards(CM); replace('cplay'); },
  cans: d => {
    if (CS.pick !== null) return;
    CS.pick = +d.k; S.cards.played++; touch();
    if (CS.pick === CS.correct) { CS.score++; CS.streak++; CS.best = Math.max(CS.best, CS.streak); S.cards.correct++; S.cards.best = Math.max(S.cards.best, CS.best); }
    else CS.streak = 0;
    save(); render(); reveal();
  },
  cnext: () => {
    if (CS.i + 1 < CS.items.length) { CS.i++; CS.pick = null; setCardOpts(); } else CS.done = true;
    render(); scrollTop();
  },

  sptab: d => { SP = d.t; render(); },
  scene: d => startScene(+d.i),
  sretry: () => startScene(SC.idx, true),
  sch: d => {
    if (SC.pick !== null) return;
    SC.pick = +d.k; SC.score += SCENES[SC.idx].turns[SC.t].c[SC.pick].v; touch(); render(); reveal();
  },
  snext: () => {
    const sc = SCENES[SC.idx]; const turn = sc.turns[SC.t]; const ch = turn.c[SC.pick];
    SC.log.push({ p: turn.p, you: ch.t, v: ch.v });
    if (SC.t + 1 < sc.turns.length) { SC.t++; SC.pick = null; SC.order = shuffle([0, 1, 2]); }
    else {
      SC.done = true;
      const prev = S.speak.scenes[sc.id]; if (prev === undefined || SC.score > prev) S.speak.scenes[sc.id] = SC.score;
      save();
    }
    render(); scrollTop();
  },
  prep: d => { S.speak.phrases[d.i] = !S.speak.phrases[d.i]; touch(); save(); render(); }
};

document.addEventListener('click', e => {
  const g = e.target.closest('.gl');
  if (g) { showTip(g.textContent, g.dataset.tr); return; }
  const s = e.target.closest('[data-say]');
  if (s) { say(s.dataset.say, s.dataset.rate ? +s.dataset.rate : 0.95); return; }
  const a = e.target.closest('[data-act]');
  if (!a || a.disabled) return;
  hideTip();
  const f = ACT[a.dataset.act];
  if (f) f(a.dataset, a);
});
document.addEventListener('input', e => { if (e.target && e.target.id === 'draft' && TS) TS.draft = e.target.value; });

/* ---------- запуск ---------- */
function init() {
  $('#tabs').innerHTML = TABS.map(t => '<button data-act="tab" data-tab="' + t[0] + '" aria-label="' + t[1] + '">' + ic(t[2]) + '<span>' + t[1] + '</span></button>').join('');
  render();
  if ('serviceWorker' in navigator && /^https?:$/.test(location.protocol)) { navigator.serviceWorker.register('sw.js').catch(() => { /* офлайн-кэш недоступен */ }); }
}
window.__lumen = { state: () => ({ S: S, Q: Q, GS: GS, TS: TS, CS: CS, SC: SC, cur: cur, stack: stack }), views: views };
init();
})();

</script>
</body>
</html>
